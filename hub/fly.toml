# fly.toml — amocsub CTF Hub
app            = 'amocsub'
primary_region = 'cdg'

[build]

[env]
  PORT          = '8080'
  DATABASE_PATH = '/data/hub.db'

[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes           = ['app']

[[vm]]
  size   = 'shared-cpu-1x'
  memory = '256mb'

[mounts]
  source      = 'hub_data'
  destination = '/data'
