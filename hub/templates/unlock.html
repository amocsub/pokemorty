{% extends 'base.html' %}
{% block title %}Unlock {{ challenge.name }} — amocsub{% endblock %}

{% block content %}
<div style="max-width:420px; margin:4rem auto;">
  <div class="page-header">
    <a href="/" class="text-muted" style="font-size:.85rem;">← Back</a>
    <h1 style="margin-top:.5rem;">{{ challenge.name }}</h1>
    <p class="text-muted mt-1">This challenge requires an access code.</p>
  </div>

  <div class="card">
    <form method="post" action="/play/{{ challenge.slug }}/unlock">
      <div class="form-group">
        <label for="access_code">Access code</label>
        <input id="access_code" name="access_code" type="password" placeholder="Enter your code" autofocus required>
      </div>
      {% if error %}
        <p class="text-red" style="font-size:.85rem; margin-bottom:.75rem;">{{ error }}</p>
      {% endif %}
      <button type="submit" class="btn btn-primary" style="width:100%;">Unlock</button>
    </form>
  </div>
</div>
{% endblock %}
