{% extends 'base.html' %}
{% block title %}Sign in — amocsub{% endblock %}

{% block head %}
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
{% endblock %}

{% block content %}
<div style="max-width:400px; margin:4rem auto; text-align:center;">
  <h1 style="margin-bottom:.5rem;">amocsub</h1>
  <p class="text-muted" style="margin-bottom:2rem;">Sign in to track your progress and compete.</p>

  <div class="card" style="padding:2rem;">
    <button id="google-btn" class="btn" style="width:100%; padding:.7em; font-size:1rem; display:flex; align-items:center; justify-content:center; gap:.75rem;">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continue with Google
    </button>
    <p id="error-msg" class="text-red mt-2" style="display:none; font-size:.85rem;"></p>
  </div>
</div>

<script>
  const firebaseConfig = {{ firebase_config | tojson }};
  const nextUrl = {{ next | tojson }};

  if (firebaseConfig.apiKey) {
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();

    document.getElementById('google-btn').addEventListener('click', async () => {
      try {
        const result = await auth.signInWithPopup(provider);
        const idToken = await result.user.getIdToken();
        const res = await fetch('/auth/callback', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ idToken, next: nextUrl })
        });
        const data = await res.json();
        if (data.ok) window.location.href = data.redirect;
        else showError(data.error || 'Authentication failed.');
      } catch (e) {
        showError(e.message);
      }
    });
  } else {
    document.getElementById('google-btn').textContent = 'Firebase not configured';
    document.getElementById('google-btn').disabled = true;
  }

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
  }
</script>
{% endblock %}
